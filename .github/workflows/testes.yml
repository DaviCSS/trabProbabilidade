name: Testar projeto
on:
  push:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar
        run: python -m unittest discover -s tests -v
      - name: Testar regras do site (JavaScript)
        run: |
          node --check docs/modelo.mjs
          node --check docs/script.js
          node --test tests/test_site.mjs
      - name: Executar roteiro em blocos
        run: python estudo_em_blocos.py
      - name: Executar e gerar PDFs
        run: |
          python maquina.py todos
          python gerar_relatorio.py
