name: Testar projeto
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar
        run: python -m unittest discover -s tests -v
      - name: Testar regras do site (JavaScript)
        run: |
          node --check docs/modelo.mjs
          node --check docs/script.js
          node --test tests/test_site.mjs
      - name: Executar e gerar PDFs
        run: |
          python maquina.py todos
          python gerar_relatorio.py
      - name: Atualizar PDF rastreável no repositório
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorio/relatorio.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza relatório dos extras selecionados [relatorio]"
            git push
          fi
